name: ci
on: [push, pull_request]
jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint chart && helm template demo chart > /dev/null
      - name: Build image
        run: docker build -t demo-service:ci service/
      - name: Trivy scan (fail on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: demo-service:ci
          version: v0.69.3
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
